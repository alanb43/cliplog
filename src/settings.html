<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Cliplog Settings</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="settings">
  <h1>Cliplog</h1>
  <p class="lead">Cliplog runs quietly in your menu bar / system tray and remembers what you copy: text, images, files and more.
    Press your shortcut anywhere to bring them back.</p>

  <form id="form">
    <label class="field">
      <span>Keyboard shortcut</span>
      <button type="button" id="shortcut" class="shortcut"></button>
      <small id="shortcut-hint">Click, then press the keys you want to use.</small>
    </label>

    <div class="pair">
      <label class="field">
        <span>Clips shown at first</span>
        <input id="quick" type="number" min="1" max="1000" required />
      </label>
      <label class="field">
        <span>After “Show more”</span>
        <input id="expanded" type="number" min="1" max="1000" required />
      </label>
    </div>

    <div class="pair">
      <label class="field">
        <span>Clips to keep</span>
        <input id="keep" type="number" min="1" max="1000" required />
      </label>
      <label class="field">
        <span>Max storage (MB)</span>
        <input id="storage" type="number" min="10" max="100000" required />
      </label>
    </div>
    <label class="field">
      <span>Max clip size in memory (KB)</span>
      <input id="clipkb" type="number" min="1" max="10240" required />
      <small>Clips up to this size are kept in memory, including copied files. Bigger clips are saved to disk, and bigger files are kept as a link to the original.</small>
    </label>
    <small id="usage" class="usage"></small>

    <label class="check">
      <input id="login" type="checkbox" />
      <span>Start Cliplog when I log in</span>
    </label>

    <p id="status" role="status"></p>

    <div class="row">
      <button type="button" id="clear" class="danger">Clear history</button>
      <button type="submit" class="primary">Save</button>
    </div>
  </form>
  <script src="common.js"></script>
  <script src="settings.js"></script>
</body>
</html>
